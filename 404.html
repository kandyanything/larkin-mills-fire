<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Larkin Mills Fire Department</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1428; color: #fff; font: 400 1.125rem/1.55 "Source Sans 3", system-ui, sans-serif; text-align: center; }
  main { padding: 48px 24px; max-width: 34rem; }
  #crest svg { width: 132px; height: 132px; margin: 0 auto 28px; display: block; }
  h1 { margin: 0; font: 400 clamp(2rem, 6vw, 3.2rem)/1.02 "Archivo Black", "Arial Black", sans-serif; letter-spacing: -.015em; }
  p { margin: 16px 0 0; color: #C6CFE3; }
  a.btn { display: inline-block; margin-top: 28px; padding: 13px 24px; border-radius: 6px; background: #E9B949; color: #14161B; font-weight: 700; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div id="crest"></div>
  <h1>That page isn't here.</h1>
  <p>The address may be mistyped, or the page may have moved. In an emergency, call 911.</p>
  <a class="btn" href="/">Go to the home page</a>
</main>
<script src="/data/site.js"></script>
<script src="/js/art.js"></script>
<script>
  (function () { var R = window.SITE, S = JSON.parse(JSON.stringify(R)); S.company = R.companyTemplate.replace('{town}', R.town); document.getElementById('crest').innerHTML = window.FireArt.emblem(S); })();
</script>
</body>
</html>
